name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Client half (glossary, matching, persistence)
        run: node test/check.cjs
      - name: Host half (endpoints, prompts, failures)
        run: node test/host-check.mjs
